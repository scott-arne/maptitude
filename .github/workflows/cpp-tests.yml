name: C++ tests

# build-wheels.yml only fires on v* tags, so nothing runs the C++ suite on a
# normal change. This job does.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  GCS_BUCKET: openeye-sdks
  OPENEYE_VERSION: "2026.1.0"
  # The Windows job builds from the presets, which build the Python bindings,
  # so it needs SWIG. Same pin as build-wheels.yml.
  SWIG_VERSION: "4.5.1"

jobs:
  ctest:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The SDK below is OpenEye's RHEL 8 build. Its static libraries call the
    # __exp_finite / __pow_finite family that glibc exported until 2.31 and
    # removed after, so nothing linked against them can link on the runner's
    # own glibc; both ctest binaries failed there with undefined references
    # into liboesystem.a and liboegrid.a. Rocky 8 carries glibc 2.28, the
    # SDK's own target, and is the container the x86_64 wheel builds in.
    container: rockylinux:8
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-openmp
            sdk_suffix: redhat-RHEL8-g++8.5-x64
            openmp: "ON"
          - name: linux-x64-serial
            sdk_suffix: redhat-RHEL8-g++8.5-x64
            openmp: "OFF"
    steps:
      - name: Install prerequisites
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools
          # The libraries the x86_64 wheel job installs for this SDK, less
          # Python. FindOpenEye calls find_package(ZLIB), and the first run in
          # this container stopped at configure with "Could NOT find ZLIB".
          dnf install -y --allowerasing \
            git curl tar gzip gcc gcc-c++ cmake ninja-build findutils \
            zlib-devel cairo

      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Download the OpenEye SDK
        run: |
          set -euo pipefail
          # The env context is unavailable in jobs.<id>.strategy, so the tarball
          # name is composed here rather than hardcoded in the matrix.
          SDK="OpenEye-toolkits-${OPENEYE_VERSION}-${{ matrix.sdk_suffix }}.tar.gz"
          echo "Fetching ${SDK}"
          mkdir -p "${RUNNER_TEMP}/openeye"
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${GCS_BUCKET}/${SDK}" \
            -o "${RUNNER_TEMP}/openeye.tar.gz"
          tar -xzf "${RUNNER_TEMP}/openeye.tar.gz" -C "${RUNNER_TEMP}/openeye" --strip-components=2
          ls -la "${RUNNER_TEMP}/openeye/"

      - name: Download the OpenEye license
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${GCS_BUCKET}/oe_license.txt" \
            -o "${RUNNER_TEMP}/openeye/oe_license.txt"

      - name: Assert the SDK version
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/openeye"
          test -d "${ROOT}/include" || { echo "SDK layout unexpected"; ls -laR "${ROOT}" | head -50; exit 1; }
          test -d "${ROOT}/lib"     || { echo "SDK layout unexpected"; ls -laR "${ROOT}" | head -50; exit 1; }

          # The SDK ships its own README naming the release:
          #   "Welcome to the OpenEye Toolkits v2026.1.0 for <platform>."
          # Assert against that, not against the tarball name we asked for --
          # the tarball name is our input, so matching it proves nothing.
          # The trailing " for " is load-bearing -- without it the match is a
          # substring test and a 2026.1.0rc1 README would satisfy a 2026.1.0 check.
          README="$(find "${ROOT}" -maxdepth 2 -name README.txt -print -quit)"
          if [ -z "${README}" ]; then
            echo "FAIL: no README.txt in the extracted SDK; cannot confirm the version"
            ls -laR "${ROOT}" | head -50
            exit 1
          fi
          echo "SDK README: ${README}"
          grep -F "OpenEye Toolkits v${OPENEYE_VERSION} for " "${README}" || {
            echo "FAIL: extracted SDK is not ${OPENEYE_VERSION}"
            head -3 "${README}"
            exit 1
          }

      - name: Configure
        env:
          OPENEYE_ROOT: ${{ runner.temp }}/openeye
        run: |
          if [ "${{ matrix.openmp }}" = "OFF" ]; then
            OPENMP_FLAG="-DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON"
          else
            OPENMP_FLAG=""
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAPTITUDE_BUILD_TESTS=ON \
            -DMAPTITUDE_BUILD_PYTHON=OFF \
            ${OPENMP_FLAG}

      - name: Assert OpenMP configuration
        run: |
          set -euo pipefail
          FLAGS="$(grep '^OpenMP_CXX_FLAGS:' build/CMakeCache.txt | cut -d= -f2- || true)"
          if [ "${{ matrix.openmp }}" = "ON" ]; then
            case "${FLAGS}" in
              *fopenmp*) echo "OpenMP enabled: ${FLAGS}" ;;
              *) echo "FAIL: expected OpenMP, got '${FLAGS}'"; exit 1 ;;
            esac
          else
            case "${FLAGS}" in
              ""|NOTFOUND) echo "OpenMP disabled as requested" ;;
              *) echo "FAIL: expected no OpenMP, got '${FLAGS}'"; exit 1 ;;
            esac
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Run ctest
        env:
          OE_LICENSE: ${{ runner.temp }}/openeye/oe_license.txt
        # CTest exits 0 when no tests are registered, so --no-tests=error
        # ensures that a discovery regression fails the build rather than
        # reporting green having run nothing.
        run: ctest --test-dir build --output-on-failure --timeout 60 --no-tests=error

  # The wheel job builds through scripts/build_python.py, so nothing else
  # builds from the presets or compiles the C++ suite on Windows. This job does
  # both, the way a Windows developer would: the presets as shipped, the
  # default generator (Visual Studio, multi-config), and no openeye-toolkits,
  # which a Windows configure must not need.
  windows:
    name: windows-x64-${{ matrix.preset }}
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    defaults:
      run:
        shell: bash
    env:
      # ilammy/msvc-dev-cmd still ships with `using: node20`; see build-wheels.yml.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install SWIG
        run: python -m pip install "swig==${SWIG_VERSION}"

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Download the OpenEye SDK
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/openeye-extract"
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${GCS_BUCKET}/OpenEye-toolkits-${OPENEYE_VERSION}-win-x64-MD.zip" \
            -o "${RUNNER_TEMP}/sdk.zip"
          unzip -q "${RUNNER_TEMP}/sdk.zip" -d "${RUNNER_TEMP}/openeye-extract"
          rm "${RUNNER_TEMP}/sdk.zip"
          sdk_inner=$(find "${RUNNER_TEMP}/openeye-extract" -maxdepth 1 -mindepth 1 -type d | head -n1)
          README="$(find "${sdk_inner}" -maxdepth 2 -name README.txt -print -quit)"
          if [ -z "${README}" ]; then
            echo "FAIL: no README.txt in the extracted SDK; cannot confirm the version"
            exit 1
          fi
          grep -F "OpenEye Toolkits v${OPENEYE_VERSION} for " "${README}" || {
            echo "FAIL: extracted SDK is not ${OPENEYE_VERSION}"
            head -3 "${README}"
            exit 1
          }
          # The preset reads OPENEYE_ROOT from the environment. A forward-slash
          # Windows path, because CMake does not understand /d/a/... MSYS paths.
          echo "OPENEYE_ROOT=$(cygpath -m "${sdk_inner}")" >> "$GITHUB_ENV"

      - name: Download the OpenEye license
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${{ steps.gcp-auth.outputs.access_token }}" \
            "https://storage.googleapis.com/${GCS_BUCKET}/oe_license.txt" \
            -o "${RUNNER_TEMP}/oe_license.txt"
          echo "OE_LICENSE=${RUNNER_TEMP}/oe_license.txt" >> "$GITHUB_ENV"

      # The runner has several Pythons; pin the one setup-python installed, as
      # a CMakeUserPresets.json would.
      - name: Configure from the preset
        run: |
          PY="$(python -c 'import sys; print(sys.executable)')"
          cmake --preset ${{ matrix.preset }} -DPython3_EXECUTABLE="${PY}"

      - name: Assert the Windows link configuration
        run: |
          set -euo pipefail
          CACHE="build-${{ matrix.preset }}/CMakeCache.txt"
          grep -qx 'OPENEYE_USE_SHARED:BOOL=OFF' "${CACHE}" || {
            echo "FAIL: expected the static OpenEye SDK"
            grep '^OPENEYE_USE_SHARED' "${CACHE}" || true
            exit 1
          }
          grep -qx 'CMAKE_MSVC_RUNTIME_LIBRARY:STRING=MultiThreadedDLL' "${CACHE}" || {
            echo "FAIL: expected the release C runtime in every configuration"
            grep '^CMAKE_MSVC_RUNTIME_LIBRARY' "${CACHE}" || true
            exit 1
          }

      - name: Build from the preset
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Run ctest from the preset
        run: ctest --preset ${{ matrix.preset }}
