[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "maptitude"
version = "0.5.0"
description = "High-performance crystallographic electron density computation and scoring"
requires-python = ">=3.11"
dependencies = ["openeye-toolkits>=2026.1"]

[tool.setuptools]
packages = ["maptitude"]
